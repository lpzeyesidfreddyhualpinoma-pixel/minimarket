version: '3.8'

services:
  db_mysql:
    image: mysql:8.0
    container_name: minimarket_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: db_minimarket_pro413
      MYSQL_USER: user_minimarket
      MYSQL_PASSWORD: user_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql_data: